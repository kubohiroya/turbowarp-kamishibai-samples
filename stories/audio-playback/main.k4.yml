kamishibai: '4.0'
controls:
  keymaps:
    production:
      Space: navigation.nextAction
assets:
  Instructions: {kind: backdrop, file: instructions.svg}
  Tone: {kind: sound, file: tone.wav}
scenes:
  opening:
    - stage: Instructions
    - audio: {id: tone, asset: Tone}
    - audioControl: {id: tone, operation: playUntilDone, fadeIn: 0.2, volume: 100, fadeOut: 0.4}
    - audioControl: {id: tone, operation: play, fadeIn: 0.2, volume: 50, fadeOut: 0.4}
    - wait: 0.4
    - audioControl: {id: tone, operation: pause}
    - audioControl: {id: tone, operation: seek, seconds: 0.25}
    - audioControl: {id: tone, operation: setVolume, volume: 200}
    - audioControl: {id: tone, operation: setPlaybackRate, rate: 1.25}
    - audioControl: {id: tone, operation: setMuted, muted: true}
    - audioControl: {id: tone, operation: setMuted, muted: false}
    - audioControl: {id: tone, operation: resume, fadeIn: 0.2, volume: 100, fadeOut: 0.4}
    - wait: 0.5
    - audioControl: {id: tone, operation: stop, fadeOut: 0.3}
    - audioControl: {id: tone, operation: loop, fadeIn: 0.3, volume: 150, fadeOut: 0.4}
    - wait: 1.5
    - audioControl: {id: tone, operation: stop, fadeOut: 0.4}
    - wait: 0.5
