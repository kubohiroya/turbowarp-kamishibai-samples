# TurboWarp紙芝居 DSL 4.0「手児奈」のSB3へ追加するスプライトと素材。
# tekona.k4.yml は、ここで登録した背景・コスチュームを名前（短形式）で参照します。
# 画像はすべて assets/ のSVG仮素材です（MPL-2.0: LICENSES.md）。
formatVersion: 1
sprites:
  Tekona:
    layerOrder: 1
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
  Suitor:
    layerOrder: 2
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
  Narration:
    layerOrder: 3
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
assets:
