# TurboWarp紙芝居 DSL 4.0「手児奈」のSB3へ追加するスプライトと素材。
# tekona.k4.yml は、ここで登録した背景・コスチューム・音を名前で参照します。
# 求婚者は1人1スプライトで、コスチューム名は stand（立ち絵）・kime（決めポーズ）・rejected（断られたポーズ）にそろえます。
# 参加者の枠のスプライト Suitor01〜 は、scripts/build-tekona.ts が workshop.config.json に従って加えます。
# 画像はすべて assets/ のSVG仮素材です（MPL-2.0: LICENSES.md）。
formatVersion: 1
sprites:
  Tekona:
    layerOrder: 1
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
  Sato:
    layerOrder: 2
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
  Kokufu:
    layerOrder: 3
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
  Miyako:
    layerOrder: 4
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
  Narration:
    layerOrder: 5
    visible: false
    x: 0
    y: 0
    size: 100
    direction: 90
    draggable: false
    rotationStyle: all around
    volume: 100
