# 市川市国府台の伝承物語　真間の手児奈（参加型紙芝居・ワークショップ用台本）
#
# 市川市真間（国府台地域）に伝わる「真間の手児奈」を、参加型紙芝居として再話した創作台本です。
# 観客はカメラの前で求婚者になりきってポーズを決めます。ポーズ認識AIがポーズを認めると、
# 求婚者は求婚の言葉を述べ、手児奈に断られ、がっかりのポーズをとります。これを求婚者の人数だけ繰り返します。
#
# 求婚者の決まり（全員共通）
#   - 構図：手児奈は下手（画面の左、x: -150）、求婚者は上手（画面の右、x: 140）に立ち、下手の手児奈に求婚する。
#   - 絵：求婚者ごとのスプライトに、コスチューム stand（立ち絵）・kime（決めポーズ）・rejected（断られたポーズ）の3つ。
#   - ポーズ認識モデル：求婚者ごとに1つ。クラス（ラベル）は stand・kime・rejected の3つ。
#
# これはワークショップ用の「半完成品」です。用意済みの求婚者8人（sato・kokufu・miyako と、考証メモ4章の#4〜#8）のあとに、
# 参加者がつくった求婚者の場面を席番号ごとに1つずつ加えて完成させます。
# 追加する場所と雛形は「★参加者」の箇所に示します。
kamishibai: "4.0"
controls:
  keymaps:
    production:
      Space: rehearsal.skipPose
      ArrowRight: rehearsal.skipAction
      ArrowDown: rehearsal.skipScene
    rehearsal:
      Space: rehearsal.skipPose
      ArrowRight: rehearsal.skipAction
      ArrowDown: rehearsal.skipScene
# 画像と音はSB3に登録済みの背景・コスチューム・音を名前で参照します（project-assets-dsl4.yml で登録）。
assets:
  # 背景
  TitleCard: backdrop
  MamaWell: backdrop
  InletSunset: backdrop
  Tsugihashi: backdrop
  Kokubunji: backdrop
  Kokuga: backdrop
  Uma: backdrop
  Kame: backdrop
  Ryo: backdrop
  Hama: backdrop
  IdoBata: backdrop
  AvantBlank: backdrop
  # 点景（考証メモ 2.6・6章）：人物の出ない短いカット
  Yoake: backdrop
  IdoMizu: backdrop
  Yugure: backdrop
  Haru: backdrop
  Natsu: backdrop
  Aki: backdrop
  Arashi: backdrop
  # 手児奈
  tekona-stand: costume:Tekona
  tekona-refuse: costume:Tekona
  tekona-resolve: costume:Tekona
  # 用意済みの求婚者。スプライトごとにコスチューム stand・kime・rejected を持つ
  sato-stand: {kind: costume, target: Sato, name: stand}
  sato-kime: {kind: costume, target: Sato, name: kime}
  sato-rejected: {kind: costume, target: Sato, name: rejected}
  kokufu-stand: {kind: costume, target: Kokufu, name: stand}
  kokufu-kime: {kind: costume, target: Kokufu, name: kime}
  kokufu-rejected: {kind: costume, target: Kokufu, name: rejected}
  miyako-stand: {kind: costume, target: Miyako, name: stand}
  miyako-kime: {kind: costume, target: Miyako, name: kime}
  miyako-rejected: {kind: costume, target: Miyako, name: rejected}
  # 入江の漁師
  ryoshi-stand: {kind: costume, target: Ryoshi, name: stand}
  ryoshi-kime: {kind: costume, target: Ryoshi, name: kime}
  ryoshi-rejected: {kind: costume, target: Ryoshi, name: rejected}
  # 歌の上手な若者
  utabito-stand: {kind: costume, target: Utabito, name: stand}
  utabito-kime: {kind: costume, target: Utabito, name: kime}
  utabito-rejected: {kind: costume, target: Utabito, name: rejected}
  # 機織りの名人の若者
  hataori-stand: {kind: costume, target: Hataori, name: stand}
  hataori-kime: {kind: costume, target: Hataori, name: kime}
  hataori-rejected: {kind: costume, target: Hataori, name: rejected}
  # 郡司の息子
  gunji-stand: {kind: costume, target: Gunji, name: stand}
  gunji-kime: {kind: costume, target: Gunji, name: kime}
  gunji-rejected: {kind: costume, target: Gunji, name: rejected}
  # 防人に出る若者
  sakimori-stand: {kind: costume, target: Sakimori, name: stand}
  sakimori-kime: {kind: costume, target: Sakimori, name: kime}
  sakimori-rejected: {kind: costume, target: Sakimori, name: rejected}
  # ★参加者：席番号NNごとに、スプライト SuitorNN のコスチュームを3行加えます。
  # sNN-stand: {kind: costume, target: SuitorNN, name: stand}
  # sNN-kime: {kind: costume, target: SuitorNN, name: kime}
  # sNN-rejected: {kind: costume, target: SuitorNN, name: rejected}
  # アバンタイトルのコウノトリ（9枚のコスチュームを順に切り替えて動かす）
  stork-1: costume:Stork
  stork-2: costume:Stork
  stork-3: costume:Stork
  stork-4: costume:Stork
  stork-5: costume:Stork
  stork-6: costume:Stork
  stork-7: costume:Stork
  stork-8: costume:Stork
  stork-9: costume:Stork
  # 点景のアクター：夕げの煙、にほ鳥（浮かぶ・潜る・水の輪）、雁の列
  kemuri-1: costume:Kemuri
  kemuri-2: costume:Kemuri
  nio-1: costume:Nio
  nio-2: costume:Nio
  nio-3: costume:Nio
  kari-1: costume:Kari
  kari-2: costume:Kari
  # ナレーション用の透明な下地
  TextPlaceholder: costume:Narration
  TitleHeadingPlaceholder: costume:TitleHeading
  # 音
  Goal Cheer: sound
  Crowd Gasp: sound
  # 用意済みの求婚者のポーズ認識モデル（クラス stand・kime・rejected）。運営側で事前に撮影・学習した共有リンクに置き換えます。
  SatoPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  KokufuPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  MiyakoPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  RyoshiPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  UtabitoPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  HataoriPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  GunjiPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  SakimoriPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://sqs.prof.cuc.ac.jp/kamishibai/20260630/6and7/
  # ★参加者：席番号NNごとに、参加者のモデル（クラス stand・kime・rejected）を加えます。
  # PoseNN:
  #   kind: recognitionModel
  #   delivery: remote
  #   loading: lazy
  #   source:
  #     url: 参加者のモデルの共有リンク
actors:
  Tekona: tekona-stand
  Sato: sato-stand
  Kokufu: kokufu-stand
  Miyako: miyako-stand
  Ryoshi: ryoshi-stand
  Utabito: utabito-stand
  Hataori: hataori-stand
  Gunji: gunji-stand
  Sakimori: sakimori-stand
  # ★参加者：席番号NNごとに1行加えます。
  # SuitorNN: sNN-stand
  Stork: stork-1
  Kemuri: kemuri-1
  Nio: nio-1
  Kari: kari-1
  Narration: TextPlaceholder
  TitleHeading: TitleHeadingPlaceholder
cover:
  backdrop: TitleCard
textStyles:
  narration:
    background: "#1d1a2bcc"
    color: "#ffffff"
    font: Noto Sans JP
    size: 110
    align: center
  title:
    background: "#00000000"
    color: "#f3e3a3"
    font: Noto Sans JP
    size: 260
    align: center
  titleHeading:
    background: "#00000000"
    color: "#f3e3a3"
    font: Noto Sans JP
    size: 150
    align: center
recognition:
  navigation:
    allowSkip: true
scenes:
  # アバンタイトル：再生直後、背景を省いた無地の画面で、水辺からコウノトリが飛び立ち、旋回しながら奥へ遠ざかる
  avant:
    - transition: {effect: fadeOut, seconds: 0.5}
    - stage: AvantBlank
    - transition: {effect: fadeUp, seconds: 1}
    - Stork.show: {skin: stork-1, x: 120, y: -120, scale: 100}
    - wait: 1.6
    - Stork.setSkin: {skin: stork-2}
    - wait: 0.6
    - Stork.setSkin: {skin: stork-3}
    - wait: 0.3
    - Stork.setSkin: {skin: stork-4}
    - wait: 0.4
    - Stork.setSkin: {skin: stork-5}
    - wait: 0.6
    - Stork.setSkin: {skin: stork-6}
    - wait: 0.7
    - Stork.setSkin: {skin: stork-7}
    - wait: 0.7
    - Stork.setSkin: {skin: stork-8}
    - wait: 0.7
    - Stork.setSkin: {skin: stork-9}
    - wait: 0.9
    - Stork.hide: {}
    - wait: 0.4
    - transition: {effect: fadeOut, seconds: 1}

  opening:
    - stage: TitleCard
    - transition: {effect: fadeUp, seconds: 1}
    - TitleHeading.show: {skin: TitleHeadingPlaceholder, x: 0, y: 58, scale: 100}
    - TitleHeading.setText:
        text: 市川市国府台の伝承物語
        style: titleHeading
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 8, scale: 100}
    - Narration.setText:
        text: 真間の手児奈
        style: title
    - wait: 4.5
    - Narration.hide: {}
    - TitleHeading.hide: {}

  # 里の暮らし：夜明けの入江の大きな景色から、入江の沖の網漁、遠浅の浜の貝・海藻とり、水辺で甲羅干しをする亀、
  # 真間の井の井戸端を経て、夕げの煙で終わる「里の一日」
  kurashi:
    - TitleHeading.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Yoake
    - transition: {effect: fadeUp, seconds: 1.5}
    - wait: 1
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text:
          - むかし、下総の国の
          - ruby: {base: 真間, reading: まま}
          - |-
            は
            山のすぐ下まで入江がせまる土地でした。
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          朝もやが晴れると、
          入江のほとりの里の一日がはじまります。
        style: narration
    - wait: 3
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Ryo
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          入江の沖では、男たちが丸木舟に乗り、
          網をたぐって魚をとりました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Hama
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          潮が引くと、遠浅の浜では女や子どもたちが
          貝や海藻をひろい、かごに集めました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Kame
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          水辺の石の上では、親亀と子亀が
          のんびりと甲羅をほしていました。
        style: narration
    - wait: 3
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: IdoBata
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          里の人びとは毎日、真間の井に水をくみに来て、
          おしゃべりに花をさかせました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    # 夕げの煙：伏屋の煙出し（背景の座標 280,190）から煙を立ちのぼらせる
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Yugure
    - transition: {effect: fadeUp, seconds: 1}
    - Kemuri.show: {skin: kemuri-1, x: 40, y: -10, scale: 100}
    - Kemuri.loop:
        steps:
          - skin: kemuri-1
            seconds: 0.7
          - skin: kemuri-2
            seconds: 0.7
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          日がかたむくと、伏屋からは
          夕げのけむりが立ちのぼりました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - wait: 1
    - Kemuri.hide: {}

  # 真間の井：井戸の寄り（空を映す清水とつるべ）から、真間の井の全景と手児奈へ
  well:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: IdoMizu
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          井戸の水はしおからいものばかり。
          でも「真間の井」だけは、きれいな水がわきました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 0.6}
    - stage: MamaWell
    - transition: {effect: fadeUp, seconds: 0.6}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - Narration.setText:
        text:
          - |-
            水をくみに来る娘たちのなかに、
            ひときわ美しい
          - ruby: {base: 手児奈, reading: てこな}
          - がいました。
        style: narration
    - wait: 3
    - Tekona.say: {text: きょうも、いい水がわいていますね。, seconds: 2.5}
    - Narration.setText:
        text: |-
          うわさは国府にも、遠い都にも広まり、
          つぎつぎと男たちが求婚にやってきました。
        style: narration
    - wait: 3.5
    # 以前ここにあった方式A（#4〜#8を地の文で一行ずつ紹介する forEach）は、
    # 8人とも場面として登場するようになったので外しました。短縮上演で人を減らすときの手順は
    # stories/tekona/README.md の「上演に合わせて求婚者を減らす」にあります。
    - Narration.hide: {}

  # 入江の漁師（考証メモ4.2）。手児奈が入江で玉藻を刈る歌（巻3・433）にもとづく、
  # 求婚の場が真間の井でない唯一の場面。網漁は kurashi で見せているので間奏はいらない。
  ryoshi:
    recognitionModel: RyoshiPose
    actions:
      - transition: {effect: fadeOut, seconds: 1}
      - Tekona.hide: {}
      - stage: Ryo
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - transition: {effect: fadeUp, seconds: 1}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText:
          text: |-
            潮の引いた朝。入江で玉藻を刈る手児奈に、
            網を上げてきた舟から声がかかりました。
          style: narration
      - wait: 3.5
      - Ryoshi.show: {skin: ryoshi-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 入江の漁師, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Ryoshi.say: {text: 両うでを斜め上へ！ 網を投げるぞ！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Ryoshi.pose:
                steps:
                  - pose: kime
                    skin: ryoshi-kime
                    sound: Goal Cheer
      - Ryoshi.setSkin: ryoshi-kime
      - Narration.hide: {}
      - Ryoshi.say: {text: この入江でいちばんの魚を、毎朝とどけよう！, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: ありがとう。その魚は、里のみんなに分けてください。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Ryoshi.say: {text: 両手で頭をかかえて、うなだれる……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Ryoshi.pose:
                steps:
                  - pose: rejected
                    skin: ryoshi-rejected
                    sound: Crowd Gasp
      - Ryoshi.setSkin: ryoshi-rejected
      - Narration.hide: {}
      - Ryoshi.say: {text: ……そうか。みんなに、か。, seconds: 2}
      - Ryoshi.hide: {}

  # 季節のカット：求婚者のあいだに春・夏・秋・冬を挟み、言葉なしで「何年も求婚が続いた」ことを見せる（考証メモ 6章）
  haru:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Haru
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          春。田に水がはられ、
          入江の葦が芽ぶくころのことです。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: MamaWell
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}

  # 用意済みの求婚者。どの求婚者も同じ流れ（登場 → kime で求婚 → 断られる → rejected でがっかり）です。
  sato:
    recognitionModel: SatoPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Sato.show: {skin: sato-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 里の若者, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Sato.say: {text: 両うでで頭の上に大きなハート！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Sato.pose:
                steps:
                  - pose: kime
                    skin: sato-kime
                    sound: Goal Cheer
      - Sato.setSkin: sato-kime
      - Narration.hide: {}
      - Sato.say: {text: 毎日、水がめを運ぶのを手伝います！ およめさんになってください！, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: ありがとう。でも、水がめは自分で運べます。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Sato.say: {text: 両うでをだらりと下げて、前かがみで立ちつくして……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Sato.pose:
                steps:
                  - pose: rejected
                    skin: sato-rejected
                    sound: Crowd Gasp
      - Sato.setSkin: sato-rejected
      - Narration.hide: {}
      - Sato.say: {text: とほほ……。, seconds: 1.5}
      - Sato.hide: {}

  # 歌の上手な若者（考証メモ4.3）。妻問ひに歌を詠みかけること、歌垣（嬥歌）は〔確〕（2.5）。
  # 断りも歌で返し、「やさしく、はっきり」を歌の形で守る。
  utabito:
    recognitionModel: UtabitoPose
    actions:
      - transition: {effect: fadeOut, seconds: 1}
      - Tekona.hide: {}
      - stage: InletSunset
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - transition: {effect: fadeUp, seconds: 1}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText:
          text: |-
            春の夕。里の若い男女が集まって歌をかけ合う
            「歌垣」の場がありました。
          style: narration
      - wait: 3.5
      - Narration.setText:
          text: |-
            水をくんで通りかかった手児奈に、
            歌の上手な若者が歌を詠みかけます。
          style: narration
      - wait: 3.5
      - Utabito.show: {skin: utabito-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 歌の上手な若者, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Utabito.say: {text: 片手を耳に当てて、片手は高く！ 歌うぞ！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Utabito.pose:
                steps:
                  - pose: kime
                    skin: utabito-kime
                    sound: Goal Cheer
      - Utabito.setSkin: utabito-kime
      - Narration.hide: {}
      - Utabito.say: {text: 真間の井に　水くむ君の　手のしずく　玉かとまがう　朝のひかりに, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: よき歌を　うれしく聞きぬ　されどわが　心は誰の　ものにもあらず, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Utabito.say: {text: 片手を額に当てて、天をあおぐ……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Utabito.pose:
                steps:
                  - pose: rejected
                    skin: utabito-rejected
                    sound: Crowd Gasp
      - Utabito.setSkin: utabito-rejected
      - Narration.hide: {}
      - Utabito.say: {text: ……歌は、とどいたのだけれど。, seconds: 2}
      - Utabito.hide: {}

  # 機織りの名人の若者（考証メモ4.6）。麻を績んで織ること、倭文幡の帯は〔確〕（巻3・431、巻9・1807、2.3）。
  hataori:
    recognitionModel: HataoriPose
    actions:
      - transition: {effect: fadeOut, seconds: 1}
      - Tekona.hide: {}
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - transition: {effect: fadeUp, seconds: 1}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText:
          text: |-
            伏屋の中で麻を績み、機で布を織る若者がいました。
            国へ納める布のほかに、一反だけ自分のために。
          style: narration
      - wait: 4
      - Hataori.show: {skin: hataori-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 機織りの名人の若者, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Hataori.say: {text: 両手を胸の前で、左右へひらいて！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Hataori.pose:
                steps:
                  - pose: kime
                    skin: hataori-kime
                    sound: Goal Cheer
      - Hataori.setSkin: hataori-kime
      - Narration.hide: {}
      - Hataori.say: {text: あなたのために、いちばん美しい布を織りました。, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: 見事な織りですね。この布は、里の娘たちみんなに織ってください。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Hataori.say: {text: 布を胸に抱きしめて、うつむく……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Hataori.pose:
                steps:
                  - pose: rejected
                    skin: hataori-rejected
                    sound: Crowd Gasp
      - Hataori.setSkin: hataori-rejected
      - Narration.hide: {}
      - Hataori.say: {text: ……みんなに、ですか。, seconds: 2}
      - Hataori.hide: {}

  # 季節のカット（夏）：にほ鳥が入江の中ほどで潜っては浮かびながら、ゆっくり右へ進む
  natsu:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Natsu
    - transition: {effect: fadeUp, seconds: 1}
    - Nio.show: {skin: nio-1, x: -30, y: -72, scale: 100}
    - Nio.loop:
        steps:
          - skin: nio-1
            seconds: 1.6
          - skin: nio-2
            seconds: 0.35
          - skin: nio-3
            seconds: 1.2
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          夏。玉藻のなびく入江で、
          にほ鳥がもぐっては浮かんでいます。
        style: narration
    - Nio.moveTo: {x: 30, y: -76, seconds: 4.5}
    - Narration.hide: {}
    - Nio.hide: {}

  # 郡司の息子（考証メモ4.4）。郡司に地元の有力者が任じられたこと、租・庸・調、葛飾早稲は〔確〕（2.4、1.5）。
  # 身分の差があって断りにくい相手として、断る自由という主題を強める。
  gunji:
    recognitionModel: GunjiPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText:
          text: |-
            秋。郡司の家が集めた稲と麻布が、
            行列をつくって国府へ運ばれていきます。
          style: narration
      - wait: 3.5
      - Narration.setText:
          text: |-
            その先頭で馬に乗っていた息子が、
            井で水をくむ手児奈を見つけました。
          style: narration
      - wait: 3.5
      - Gunji.show: {skin: gunji-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 郡司の息子, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Gunji.say: {text: 両手を腰に当てて、胸を張って！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Gunji.pose:
                steps:
                  - pose: kime
                    skin: gunji-kime
                    sound: Goal Cheer
      - Gunji.setSkin: gunji-kime
      - Narration.hide: {}
      - Gunji.say: {text: わが家の田は、この葛飾でいちばん広いぞ。どうだ。, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: 広い田のことは、よくわかりました。わたしは、あなたのことを知りません。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Gunji.say: {text: むちを取り落として、腕を組む……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Gunji.pose:
                steps:
                  - pose: rejected
                    skin: gunji-rejected
                    sound: Crowd Gasp
      - Gunji.setSkin: gunji-rejected
      - Narration.hide: {}
      - Gunji.say: {text: ……ぐっ。この、おれが。, seconds: 2}
      - Gunji.hide: {}

  # 国府の工事場：国府の役人の求婚の前に、手児奈のうわさが国府にも届いていたことを見せる
  kokuga:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Kokuga
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          そのころ国府では、新しい役所の建物を建てていました。
          役人たちは木簡を広げ、大工の棟梁と工事の進み具合を話し合います。
        style: narration
    - wait: 4
    - Narration.setText:
        text: |-
          けれども若い役人の心は、
          真間の井の手児奈のことでいっぱいでした。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: MamaWell
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}

  kokufu:
    recognitionModel: KokufuPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Kokufu.show: {skin: kokufu-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 国府の役人, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Kokufu.say: {text: 片手を胸に、もう片方の手をさしだして！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Kokufu.pose:
                steps:
                  - pose: kime
                    skin: kokufu-kime
                    sound: Goal Cheer
      - Kokufu.setSkin: kokufu-kime
      - Narration.hide: {}
      - Kokufu.say: {text: 国府の役人として、あなたを一生守ってみせましょう。, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: お役目、ごくろうさまです。でも、お受けできません。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Kokufu.say: {text: 背すじをのばしたまま、深く頭を下げる……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Kokufu.pose:
                steps:
                  - pose: rejected
                    skin: kokufu-rejected
                    sound: Crowd Gasp
      - Kokufu.setSkin: kokufu-rejected
      - Narration.hide: {}
      - Kokufu.say: {text: ……役目にもどります。, seconds: 1.5}
      - Kokufu.hide: {}

  # 季節のカット（秋）：雁の列が空を左から右へ渡る。字幕は空をあけて画面の下に出す
  aki:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Aki
    - transition: {effect: fadeUp, seconds: 1}
    - Kari.show: {skin: kari-1, x: -260, y: 70, scale: 90}
    - Kari.loop:
        steps:
          - skin: kari-1
            seconds: 0.3
          - skin: kari-2
            seconds: 0.3
    - Narration.show: {skin: TextPlaceholder, x: 0, y: -120, scale: 100}
    - Narration.setText:
        text: |-
          秋。葛飾早稲が実り、
          北から雁がわたってきました。
        style: narration
    - Kari.moveTo: {x: 270, y: 92, seconds: 5}
    - Narration.hide: {}
    - Kari.hide: {}

  # 都からの旅：都の貴族の求婚の前に、従者に馬を引かせて入江の板橋をわたり、真間へやって来るところを見せる
  # （継橋は物語の終わりに男たちがかけるので、ここでは「継橋」と呼ばない）
  uma:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Uma
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          手児奈のうわさは、遠い都にまで届いていました。
          都の貴族が、従者に馬を引かせて真間へやって来ます。
        style: narration
    - wait: 4
    - Narration.setText:
        text: |-
          入江の板橋をわたる馬の上から、浜で働く女たちをながめ、
          貴族は「手児奈はどこにいるのだろう」と思いました。
        style: narration
    - wait: 4
    - Narration.hide: {}
    - transition: {effect: fadeOut, seconds: 1}
    - stage: MamaWell
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}

  miyako:
    recognitionModel: MiyakoPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Miyako.show: {skin: miyako-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 都の貴族, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Miyako.say: {text: 両うでを大きく、横にひろげて！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Miyako.pose:
                steps:
                  - pose: kime
                    skin: miyako-kime
                    sound: Goal Cheer
      - Miyako.setSkin: miyako-kime
      - Narration.hide: {}
      - Miyako.say: {text: 都の屋敷も、絹の着物も、ぜんぶあなたのものです！, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: 私は、自分が生まれ育ったこの真間の自然と人々が好き。私はここを離れるつもりはありません, seconds: 7}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Miyako.say: {text: 上体を引いて、片手で口もとをおおって……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Miyako.pose:
                steps:
                  - pose: rejected
                    skin: miyako-rejected
                    sound: Crowd Gasp
      - Miyako.setSkin: miyako-rejected
      - Narration.hide: {}
      - Miyako.say: {text: 都に帰るとするか……。, seconds: 1.5}
      - Miyako.hide: {}

  # 防人に出る若者（考証メモ4.5）。東国から防人が出たことは〔確〕（2.4）。
  # 家族と離れるつらい務めだったことに必ずふれる。弓矢は手児奈のほうへ向けない。
  # 小学生向けの上演では外すことをすすめます（README「上演に合わせて求婚者を減らす」）。
  sakimori:
    recognitionModel: SakimoriPose
    actions:
      - transition: {effect: fadeOut, seconds: 1}
      - Tekona.hide: {}
      - stage: Kokuga
      - transition: {effect: fadeUp, seconds: 1}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText:
          text: |-
            東国からは、九州の守りにつく「防人」が出ました。
            家族と何年も離れる、つらい務めです。
          style: narration
      - wait: 4
      - Narration.setText:
          text: |-
            国府に集められた若者たちは、
            翌朝、九州へ向かう旅に出ます。
          style: narration
      - wait: 3.5
      - Narration.hide: {}
      - transition: {effect: fadeOut, seconds: 1}
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - transition: {effect: fadeUp, seconds: 1}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText:
          text: |-
            その前の夕、ひとりが真間の井へ
            水を飲みに寄りました。
          style: narration
      - wait: 3
      - Sakimori.show: {skin: sakimori-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 防人に出る若者, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Sakimori.say: {text: 足を広げて、手児奈のほうの手を胸に。弓矢は下げたまま！, seconds: 2.5}
      - invalidate:
          condition: false
          then:
            - Sakimori.pose:
                steps:
                  - pose: kime
                    skin: sakimori-kime
                    sound: Goal Cheer
      - Sakimori.setSkin: sakimori-kime
      - Narration.hide: {}
      - Sakimori.say: {text: 遠い九州から帰ったら、妻になってくれないか。, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: ......あなたが無事に戻ることを、心からお祈りしています。, seconds: 4.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Sakimori.say: {text: 弓の先を地につけ、まっすぐ立ったまま……。, seconds: 2}
      - invalidate:
          condition: false
          then:
            - Sakimori.pose:
                steps:
                  - pose: rejected
                    skin: sakimori-rejected
                    sound: Crowd Gasp
      - Sakimori.setSkin: sakimori-rejected
      - Narration.hide: {}
      - Sakimori.say: {text: ……その言葉を、持っていく。, seconds: 2}
      - Sakimori.hide: {}


  # ★参加者：席番号NNの求婚者の場面。この雛形を複製して quarrel の前に席番号順に加え、
  #   〔 〕の部分を掲示板の提出内容に置き換えます。ポーズのクラス名は全員 kime と rejected です。
  # suitor-NN:
  #   recognitionModel: PoseNN
  #   actions:
  #     - stage: MamaWell
  #     - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
  #     - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
  #     - SuitorNN.show: {skin: sNN-stand, x: 140, y: -75, scale: 65}
  #     - Narration.setText: {text: 〔作者の名前〕さんの求婚者「〔求婚者の名前〕」, style: narration}
  #     - wait: 2
  #     - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
  #     - SuitorNN.say: {text: 〔決めポーズの説明〕, seconds: 2.5}
  #     - SuitorNN.pose:
  #         steps:
  #           - pose: kime
  #             skin: sNN-kime
  #             sound: Goal Cheer
  #     - Narration.hide: {}
  #     - SuitorNN.say: {text: 〔求婚の言葉〕, seconds: 3.5}
  #     - Tekona.think: {text: （……ちょっとだけ、心が揺れました）, seconds: 2.5}
  #     - Tekona.setSkin: tekona-refuse
  #     - Tekona.say: {text: 〔手児奈の断りの言葉〕, seconds: 3.5}
  #     - Tekona.setSkin: tekona-stand
  #     - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
  #     - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
  #     - SuitorNN.say: {text: 〔落胆のポーズの説明〕, seconds: 2}
  #     - SuitorNN.pose:
  #         steps:
  #           - pose: rejected
  #             skin: sNN-rejected
  #             sound: Crowd Gasp
  #     - Narration.hide: {}
  #     - SuitorNN.say: {text: 〔断られたときの一言〕, seconds: 1.5}
  #     - SuitorNN.hide: {}
  #   （手児奈の心が揺れなかったときは、Tekona.think の1行を消します）

  # 争い（冬の嵐の夜）：「真間のおすひに波もとどろに」（巻14・3385）、「波の音の騒く」（巻9・1807）を下敷きに、
  # 波のとどろく夜の入江で争いの重さを見せ、手児奈を岸に立たせて伝承の結末を暗示する
  quarrel:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Arashi
    - transition: {effect: fadeUp, seconds: 1.5}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          冬。断られても、男たちはあきらめません。
          「手児奈にふさわしいのは、このわたしだ！」
        style: narration
    - wait: 3.5
    # 方式C（終盤の回収）：言い出したのは郡司の息子（考証メモ4.4）
    - Narration.setText:
        text: |-
          はじめにそう言い出したのは、
          郡司の息子でした。
        style: narration
    - wait: 3
    - Narration.setText:
        text: |-
          男たちは言いあらそいをはじめ、
          なかよしの兄弟まで、けんかをするようになりました。
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          そのさわぎは、真間の磯辺の波が
          とどろくほどだったといいます。
        style: narration
    - wait: 3.5
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - Tekona.think: {text: わたしの心はひとつ。からだもひとつ。, seconds: 3}
    - Tekona.think: {text: わたしのせいで、みんながあらそうなんて……。, seconds: 3}
    - Narration.hide: {}

  inlet:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: InletSunset
    - Tekona.show: {skin: tekona-stand, x: 0, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          嵐がすぎたあと、手児奈は小川にそって歩き、
          夕日にそまる真間の入江にやってきました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - Tekona.think: {text: だれかを選ばなければ、いけないのかしら。, seconds: 3}
    - wait: 1
    - Tekona.setSkin: tekona-resolve
    - Tekona.say: {text: いいえ。わたしの心は、わたしのもの。, seconds: 3}
    - Tekona.say: {text: だれかひとりのものには、なりません。, seconds: 3}

  tsugihashi:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Tsugihashi
    - Tekona.show: {skin: tekona-resolve, x: -150, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          里にもどった手児奈は、
          男たちの前で、はっきりと言いました。
        style: narration
    - wait: 3
    - Narration.hide: {}
    - Tekona.say: {text: あらそうのは、もうやめてください。, seconds: 3}
    - Tekona.say: {text: その力を、みんなのために使ってほしいのです。, seconds: 3}
    - Tekona.say: {text: 入江をこえて、だれもが真間の井に来られるように。, seconds: 3.5}
    - Sato.show: {skin: sato-stand, x: 140, y: -75, scale: 60}
    - Sato.say: {text: ……おれたち、はずかしいことをしていたな。, seconds: 3}
    - Sato.hide: {}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          男たちは力をあわせ、入江に板をつないで
          橋をかけました。
        style: narration
    - wait: 3.5
    # 方式C（終盤の回収）：求婚した男たちの技が橋づくりでどう生きたかを一行ずつ（考証メモ4.2〜4.6、4.8）。
    # 上演でその人を出さないときは shown を false にする。登場する求婚者の場面と順番・人数をそろえる。
    - forEach:
        as: man
        items:
          - shown: true
            text: |-
              入江の漁師は丸木舟を出し、
              橋の杭を運びました。
          - shown: true
            text: |-
              機織りの名人は、橋板を結ぶ綱を
              より合わせました。
          - shown: true
            text: |-
              歌の上手な若者は、みんなの手が
              そろうように歌で音頭をとりました。
          - shown: true
            text: |-
              郡司の息子は、わが家の人手と
              木材を出しました。
          - shown: true
            text: |-
              九州の守りに出た若者は、できた橋を
              わたって旅立っていきました。
        do:
          - if:
              condition: {ref: man.shown}
              then:
                - Narration.setText: {text: {ref: man.text}, style: narration}
                - wait: 3
    - Narration.setText:
        text: |-
          そして手児奈は、今日も真間の井で
          みんなといっしょに水をくんでいます。
        style: narration
    - wait: 3.5
    - Tekona.setSkin: tekona-stand
    - wait: 1.5

  # 後日談：やがて国府台の丘の上に下総国分寺が建てられる（天平13年の国分寺建立の詔のあと。考証メモ1.5）
  kokubunji:
    - transition: {effect: fadeOut, seconds: 1}
    - Tekona.hide: {}
    - stage: Kokubunji
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text:
          - それから時がたち、
          - ruby: {base: 国府台, reading: こうのだい}
          - |-
            の丘の上に
            下総の国分寺が建てられることになりました。
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          男たちは力をあわせて大きなお堂の屋根を上げ、
          仏師は木を彫って、仏さまをつくりました。
        style: narration
    - wait: 4
    # 方式C（終盤の回収）：機織りの名人と郡司の息子（考証メモ4.4、4.6）
    - Narration.setText:
        text: |-
          機織りの名人は金堂にかける幡を織り、
          郡司の息子は、はたらく人びとを集めました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - wait: 1.5

  afterword:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: TitleCard
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 0, scale: 100}
    - Narration.setText:
        text: |-
          この紙芝居は、市川市真間に伝わる
          「真間の手児奈」をもとにした再話です。
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          言い伝えでは、手児奈は夕日の入江に姿を消し、
          里の人びとが真間の井のそばにまつったといいます。
        style: narration
    - wait: 4.5
    - Narration.setText:
        text: |-
          いまも真間には手児奈霊堂があり、
          真間の井や継橋のあとも残っています。
        style: narration
    - wait: 4
    - Narration.setText: {text: おしまい, style: title}
    - wait: 3
