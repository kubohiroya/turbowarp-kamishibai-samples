# 手児奈 ― 真間の井の求婚者たち（参加型紙芝居・ワークショップ用台本）
#
# 市川市真間（国府台地域）に伝わる「真間の手児奈」を、参加型紙芝居として再話した創作台本です。
# 観客はカメラの前で求婚者になりきってポーズを決めます。ポーズ認識AIがポーズを認めると、
# 求婚者は求婚の言葉を述べ、手児奈に断られ、がっかりのポーズをとります。これを求婚者の人数だけ繰り返します。
#
# 求婚者の決まり（全員共通）
#   - 構図：手児奈は下手（画面の左、x: -150）、求婚者は上手（画面の右、x: 140）に立ち、下手の手児奈に求婚する。
#   - 絵：求婚者ごとのスプライトに、コスチューム stand（立ち絵）・kime（決めポーズ）・rejected（断られたポーズ）の3つ。
#   - ポーズ認識モデル：求婚者ごとに1つ。クラス（ラベル）は stand・kime・rejected の3つ。
#
# これはワークショップ用の「半完成品」です。用意済みの求婚者3人（sato・kokufu・miyako）のあとに、
# 参加者がつくった求婚者の場面を席番号ごとに1つずつ加えて完成させます。
# 追加する場所と雛形は「★参加者」の箇所に示します。
kamishibai: "4.0"
controls:
  keymaps:
    production:
      Space: rehearsal.skipPose
      ArrowRight: rehearsal.skipAction
      ArrowDown: rehearsal.skipScene
    rehearsal:
      Space: rehearsal.skipPose
      ArrowRight: rehearsal.skipAction
      ArrowDown: rehearsal.skipScene
# 画像と音はSB3に登録済みの背景・コスチューム・音を名前で参照します（project-assets-dsl4.yml で登録）。
assets:
  # 背景
  TitleCard: backdrop
  MamaWell: backdrop
  InletSunset: backdrop
  Tsugihashi: backdrop
  # 手児奈
  tekona-stand: costume:Tekona
  tekona-refuse: costume:Tekona
  tekona-resolve: costume:Tekona
  # 用意済みの求婚者。スプライトごとにコスチューム stand・kime・rejected を持つ
  sato-stand: {kind: costume, target: Sato, name: stand}
  sato-kime: {kind: costume, target: Sato, name: kime}
  sato-rejected: {kind: costume, target: Sato, name: rejected}
  kokufu-stand: {kind: costume, target: Kokufu, name: stand}
  kokufu-kime: {kind: costume, target: Kokufu, name: kime}
  kokufu-rejected: {kind: costume, target: Kokufu, name: rejected}
  miyako-stand: {kind: costume, target: Miyako, name: stand}
  miyako-kime: {kind: costume, target: Miyako, name: kime}
  miyako-rejected: {kind: costume, target: Miyako, name: rejected}
  # ★参加者：席番号NNごとに、スプライト SuitorNN のコスチュームを3行加えます。
  # sNN-stand: {kind: costume, target: SuitorNN, name: stand}
  # sNN-kime: {kind: costume, target: SuitorNN, name: kime}
  # sNN-rejected: {kind: costume, target: SuitorNN, name: rejected}
  # ナレーション用の透明な下地
  TextPlaceholder: costume:Narration
  # 音
  Medieval1: sound
  Goal Cheer: sound
  Crowd Gasp: sound
  Xylo2: sound
  # 用意済みの求婚者のポーズ認識モデル（クラス stand・kime・rejected）。運営側で事前に撮影・学習した共有リンクに置き換えます。
  SatoPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://teachablemachine.withgoogle.com/models/REPLACE-WITH-SATO-MODEL/
  KokufuPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://teachablemachine.withgoogle.com/models/REPLACE-WITH-KOKUFU-MODEL/
  MiyakoPose:
    kind: recognitionModel
    delivery: remote
    loading: lazy
    source:
      url: https://teachablemachine.withgoogle.com/models/REPLACE-WITH-MIYAKO-MODEL/
  # ★参加者：席番号NNごとに、参加者のモデル（クラス stand・kime・rejected）を加えます。
  # PoseNN:
  #   kind: recognitionModel
  #   delivery: remote
  #   loading: lazy
  #   source:
  #     url: 参加者のモデルの共有リンク
actors:
  Tekona: tekona-stand
  Sato: sato-stand
  Kokufu: kokufu-stand
  Miyako: miyako-stand
  # ★参加者：席番号NNごとに1行加えます。
  # SuitorNN: sNN-stand
  Narration: TextPlaceholder
cover:
  backdrop: TitleCard
textStyles:
  narration:
    background: "#1d1a2bcc"
    color: "#ffffff"
    font: Noto Sans JP
    size: 110
    align: center
  title:
    background: "#00000000"
    color: "#f3e3a3"
    font: Noto Sans JP
    size: 260
    align: center
recognition:
  navigation:
    allowSkip: true
scenes:
  opening:
    - stage: TitleCard
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 20, scale: 100}
    - Narration.setText: {text: 手児奈, style: title}
    - wait: 2
    - Narration.setText:
        text: |-
          真間の井の
          求婚者たち
        style: title
    - wait: 2.5
    - Narration.hide: {}

  well:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: MamaWell
    - bgm: Medieval1
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          むかし、下総の国の真間は
          山のすぐ下まで入江がせまる土地でした。
        style: narration
    - wait: 3
    - Narration.setText:
        text: |-
          井戸の水はしおからいものばかり。
          でも「真間の井」だけは、きれいな水がわきました。
        style: narration
    - wait: 3.5
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - Narration.setText:
        text: |-
          水をくみに来る娘たちのなかに、
          ひときわ美しい手児奈がいました。
        style: narration
    - wait: 3
    - Tekona.say: {text: きょうも、いい水がわいていますね。, seconds: 2.5}
    - Narration.setText:
        text: |-
          うわさは国府にも、遠い都にも広まり、
          つぎつぎと男たちが求婚にやってきました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}

  # 用意済みの求婚者。どの求婚者も同じ流れ（登場 → kime で求婚 → 断られる → rejected でがっかり）です。
  sato:
    recognitionModel: SatoPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Sato.show: {skin: sato-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 里の若者, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Sato.say: {text: 両うでで頭の上に大きなハート！, seconds: 2.5}
      - Sato.pose:
          steps:
            - pose: kime
              skin: sato-kime
              sound: Goal Cheer
      - Narration.hide: {}
      - Sato.say: {text: 毎日、水がめを運ぶのを手伝います！ およめさんになってください！, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: ありがとう。でも、水がめは自分で運べます。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Sato.say: {text: 肩を落として、がっくり……。, seconds: 2}
      - Sato.pose:
          steps:
            - pose: rejected
              skin: sato-rejected
              sound: Crowd Gasp
      - Narration.hide: {}
      - Sato.say: {text: とほほ……。, seconds: 1.5}
      - Sato.hide: {}

  kokufu:
    recognitionModel: KokufuPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Kokufu.show: {skin: kokufu-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 国府の役人, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Kokufu.say: {text: 片手を胸に、もう片方の手をさしだして！, seconds: 2.5}
      - Kokufu.pose:
          steps:
            - pose: kime
              skin: kokufu-kime
              sound: Goal Cheer
      - Narration.hide: {}
      - Kokufu.say: {text: 国府の役人として、あなたを一生守ってみせましょう。, seconds: 3.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: お役目、ごくろうさまです。でも、お受けできません。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Kokufu.say: {text: 肩を落として、がっくり……。, seconds: 2}
      - Kokufu.pose:
          steps:
            - pose: rejected
              skin: kokufu-rejected
              sound: Crowd Gasp
      - Narration.hide: {}
      - Kokufu.say: {text: ……役目にもどります。, seconds: 1.5}
      - Kokufu.hide: {}

  miyako:
    recognitionModel: MiyakoPose
    actions:
      - stage: MamaWell
      - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Miyako.show: {skin: miyako-stand, x: 140, y: -75, scale: 60}
      - Narration.setText: {text: 都の貴族, style: narration}
      - wait: 2
      - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
      - Miyako.say: {text: 両うでを大きく、横にひろげて！, seconds: 2.5}
      - Miyako.pose:
          steps:
            - pose: kime
              skin: miyako-kime
              sound: Goal Cheer
      - Narration.hide: {}
      - Miyako.say: {text: 都の屋敷も、絹の着物も、ぜんぶあなたのものです！, seconds: 3.5}
      - Tekona.think: {text: （……ちょっとだけ、心が揺れました）, seconds: 2.5}
      - Tekona.setSkin: tekona-refuse
      - Tekona.say: {text: すてきなお話……。でも、わたしは真間をはなれません。, seconds: 3.5}
      - Tekona.setSkin: tekona-stand
      - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
      - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
      - Miyako.say: {text: 肩を落として、がっくり……。, seconds: 2}
      - Miyako.pose:
          steps:
            - pose: rejected
              skin: miyako-rejected
              sound: Crowd Gasp
      - Narration.hide: {}
      - Miyako.say: {text: 都に帰るとするか……。, seconds: 1.5}
      - Miyako.hide: {}

  # ★参加者：席番号NNの求婚者の場面。この雛形を複製して quarrel の前に席番号順に加え、
  #   〔 〕の部分を掲示板の提出内容に置き換えます。ポーズのクラス名は全員 kime と rejected です。
  # suitor-NN:
  #   recognitionModel: PoseNN
  #   actions:
  #     - stage: MamaWell
  #     - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
  #     - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
  #     - SuitorNN.show: {skin: sNN-stand, x: 140, y: -75, scale: 65}
  #     - Narration.setText: {text: 〔作者の名前〕さんの求婚者「〔求婚者の名前〕」, style: narration}
  #     - wait: 2
  #     - Narration.setText: {text: カメラの前で、求婚のポーズを決めよう！, style: narration}
  #     - SuitorNN.say: {text: 〔決めポーズの説明〕, seconds: 2.5}
  #     - SuitorNN.pose:
  #         steps:
  #           - pose: kime
  #             skin: sNN-kime
  #             sound: Goal Cheer
  #     - Narration.hide: {}
  #     - SuitorNN.say: {text: 〔求婚の言葉〕, seconds: 3.5}
  #     - Tekona.think: {text: （……ちょっとだけ、心が揺れました）, seconds: 2.5}
  #     - Tekona.setSkin: tekona-refuse
  #     - Tekona.say: {text: 〔手児奈の断りの言葉〕, seconds: 3.5}
  #     - Tekona.setSkin: tekona-stand
  #     - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
  #     - Narration.setText: {text: 断られた……。がっかりのポーズ！, style: narration}
  #     - SuitorNN.say: {text: 〔落胆のポーズの説明〕, seconds: 2}
  #     - SuitorNN.pose:
  #         steps:
  #           - pose: rejected
  #             skin: sNN-rejected
  #             sound: Crowd Gasp
  #     - Narration.hide: {}
  #     - SuitorNN.say: {text: 〔断られたときの一言〕, seconds: 1.5}
  #     - SuitorNN.hide: {}
  #   （手児奈の心が揺れなかったときは、Tekona.think の1行を消します）

  quarrel:
    - stage: MamaWell
    - Tekona.show: {skin: tekona-stand, x: -150, y: -75, scale: 60}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          断られても、男たちはあきらめません。
          「手児奈にふさわしいのは、このわたしだ！」
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          男たちは言いあらそいをはじめ、
          なかよしの兄弟まで、けんかをするようになりました。
        style: narration
    - wait: 3.5
    - Tekona.think: {text: わたしの心はひとつ。からだもひとつ。, seconds: 3}
    - Tekona.think: {text: わたしのせいで、みんながあらそうなんて……。, seconds: 3}
    - Narration.hide: {}

  inlet:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: InletSunset
    - Tekona.show: {skin: tekona-stand, x: 0, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          手児奈は小川にそって歩き、
          夕日にそまる真間の入江にやってきました。
        style: narration
    - wait: 3.5
    - Narration.hide: {}
    - Tekona.think: {text: だれかを選ばなければ、いけないのかしら。, seconds: 3}
    - wait: 1
    - Tekona.setSkin: tekona-resolve
    - Tekona.say: {text: いいえ。わたしの心は、わたしのもの。, seconds: 3}
    - Tekona.say: {text: だれかひとりのものには、なりません。, seconds: 3}

  tsugihashi:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: Tsugihashi
    - bgm: Xylo2
    - Tekona.show: {skin: tekona-resolve, x: -150, y: -75, scale: 60}
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          里にもどった手児奈は、
          男たちの前で、はっきりと言いました。
        style: narration
    - wait: 3
    - Narration.hide: {}
    - Tekona.say: {text: あらそうのは、もうやめてください。, seconds: 3}
    - Tekona.say: {text: その力を、みんなのために使ってほしいのです。, seconds: 3}
    - Tekona.say: {text: 入江をこえて、だれもが真間の井に来られるように。, seconds: 3.5}
    - Sato.show: {skin: sato-stand, x: 140, y: -75, scale: 60}
    - Sato.say: {text: ……おれたち、はずかしいことをしていたな。, seconds: 3}
    - Sato.hide: {}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 140, scale: 100}
    - Narration.setText:
        text: |-
          男たちは力をあわせ、入江に板をつないで
          橋をかけました。
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          そして手児奈は、今日も真間の井で
          みんなといっしょに水をくんでいます。
        style: narration
    - wait: 3.5
    - Tekona.setSkin: tekona-stand
    - wait: 1.5

  afterword:
    - transition: {effect: fadeOut, seconds: 1}
    - stage: TitleCard
    - transition: {effect: fadeUp, seconds: 1}
    - Narration.show: {skin: TextPlaceholder, x: 0, y: 0, scale: 100}
    - Narration.setText:
        text: |-
          この紙芝居は、市川市真間に伝わる
          「真間の手児奈」をもとにした再話です。
        style: narration
    - wait: 3.5
    - Narration.setText:
        text: |-
          言い伝えでは、手児奈は夕日の入江に姿を消し、
          里の人びとが真間の井のそばにまつったといいます。
        style: narration
    - wait: 4.5
    - Narration.setText:
        text: |-
          いまも真間には手児奈霊堂があり、
          真間の井や継橋のあとも残っています。
        style: narration
    - wait: 4
    - Narration.setText: {text: おしまい, style: title}
    - wait: 3
