kamishibai: "4.0"
controls:
  keymaps:
    production:
      Space: navigation.nextAction
assets:
  Instructions: {kind: backdrop, file: instructions.svg}
  NarratorIdle: {kind: costume, target: Narrator, file: narrator.svg}
actors:
  Narrator: NarratorIdle
scenes:
  visits:
    - stage: Instructions
    - forEach:
        as: visit
        items:
          - { name: 長兄, kind: false }
          - { name: 次兄, kind: false }
          - { name: 末弟, kind: true }
        do:
          - Narrator.say: { text: { ref: visit.name }, seconds: 1.5 }
          - if:
              condition: { ref: visit.kind }
              then:
                - Narrator.say: { text: 贈り物, seconds: 1.5 }
              else:
                - Narrator.say: { text: 何もなし, seconds: 1.5 }
