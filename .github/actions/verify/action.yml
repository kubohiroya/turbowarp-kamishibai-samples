name: Verify the samples site
description: >-
  Installs both workspaces and verifies the samples. Every run builds with the committed App pin;
  Pages and scheduled runs additionally report whether a newer published release is available, and
  run the full verification. Following a release is an explicit `pnpm update:app-release`, never a
  side effect of this action.

inputs:
  pull-request:
    description: >-
      The pull request being verified. Its changed files select the browser checks.
      Leave empty for the full published-release verification.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    # Read-only. This used to run `node scripts/app-release.ts`, which rewrites app-release.json and
    # the base SB3 in the workspace, so the deploy and the scheduled run built against whatever was
    # newest upstream while the repository pinned something older. That skew stopped the Pages
    # deploy twice when App 4.0.13 was published, and left the site's bytes differing from the
    # release assets. The pin is followed by a reviewed pull request now; this only reports.
    - name: Report whether a newer published app release is available
      if: inputs.pull-request == ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/app-release.ts --check
    # Playback, authoring and the downloaded base share this release commit.
    - id: pin
      shell: bash
      run: |
        commit=$(node -e "process.stdout.write(require('./app-release.json').commit)")
        printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
        printf 'Pinned builder commit: %s\n' "$commit"
        printf 'TURBOWARP_KAMISHIBAI_BLOCK_AUTHORING_ROOT=%s/.tmp/turbowarp-kamishibai-app\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        repository: kubohiroya/turbowarp-kamishibai-app
        ref: ${{ steps.pin.outputs.commit }}
        path: .tmp/turbowarp-kamishibai-app
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          .tmp/turbowarp-kamishibai-app/pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
    # The SB3 files are GitHub Release assets recorded in sb3-assets.json, not committed. Fetch
    # them before the build below, which reads some of them and compares the rest against them.
    - shell: bash
      run: pnpm sb3:fetch
    - shell: bash
      working-directory: .tmp/turbowarp-kamishibai-app
      run: pnpm install --frozen-lockfile
    # Since 4.0.0-rc.12 the pinned CLI runs the compiled dist/, which
    # TurboWarp-Kamishibai does not commit.
    - shell: bash
      working-directory: .tmp/turbowarp-kamishibai-app
      run: pnpm run build:lib
    # The deploy and the scheduled run used to `pnpm update:dsl4-artifacts` here, so that a newly
    # published App reached the site without waiting for a pull request. The pin is followed by a
    # reviewed pull request now (the --check step above only reports), and what was left did harm:
    #
    #   - It rewrote every lock in the workspace immediately before `pnpm run check` rebuilt and
    #     compared against them. On these runs the freshness check compared a build with itself, so
    #     the one check that says "this commit's locks describe what the pinned App builds" said
    #     nothing exactly where the bytes were about to be published.
    #   - It replaced the fetched release assets with locally rebuilt bytes, against
    #     「公開済みの版付き成果物を使用し、取得元・対応版・ハッシュを確認する」 in AGENTS.md.
    #   - Covering the stories by hand, it could leave one behind. tekona was missing, so every
    #     deploy after App 4.0.13 was published failed on "Tekona workshop artifacts are stale"
    #     while the pull requests passed. Without this step there is no release here for a lock to
    #     lag behind, and that whole class of deploy-only failure goes with it.
    #
    # Removing it loses no verification and restores one: `pnpm run check` passes every stage
    # without it, and dist still matches all 19 published records byte for byte.
    #
    # It is also the largest single cost in the deploy. This step's own timing was 224s on the run
    # where it was measured, and the deploys since bear that out at a different scale: this action
    # took 517s, 585s and 577s on the three deploys before the removal and 437s on the first one
    # after it, so about 120s of a 560s action rather than the 224s of a slower run. The deploy job
    # as a whole went from 716s, 788s and 776s to 642s.
    - id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        scope=all
        if [[ -n "$PULL_REQUEST" ]]; then
          scope=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | node scripts/web-checks-scope.ts)
        fi
        case "$scope" in
          all) browsers=chromium-webkit ;;
          dsl4|editor) browsers=chromium ;;
          none) browsers= ;;
          *) printf 'Unknown browser check scope: %s\n' "$scope" >&2; exit 1 ;;
        esac
        printf 'web-checks=%s\nbrowsers=%s\n' "$scope" "$browsers" >> "$GITHUB_OUTPUT"
        printf 'Browser checks: %s\n' "$scope"
    - id: playwright-version
      if: steps.scope.outputs.browsers != ''
      shell: bash
      run: |
        version=$(node -e "process.stdout.write(require('playwright/package.json').version)")
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
        printf 'image=%s\n' "$ImageOS" >> "$GITHUB_OUTPUT"
        printf 'image-version=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: steps.scope.outputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.playwright-version.outputs.image }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ steps.scope.outputs.browsers }}
    # Cached browser binaries still need the system libraries on a fresh runner. WebKit pulls
    # about 114 MB of .deb packages from the Ubuntu mirror: usually seconds, but over 11 min on a
    # day the mirror ran at 166 kB/s. Keep the downloaded packages in the Actions cache so apt
    # only fetches what changed. A runner image update still restores the previous set.
    - id: playwright-apt-cache
      if: steps.scope.outputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/playwright-apt
        key: playwright-apt-${{ steps.playwright-version.outputs.image }}-${{ steps.playwright-version.outputs.image-version }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ steps.scope.outputs.browsers }}
        restore-keys: |
          playwright-apt-${{ steps.playwright-version.outputs.image }}-
    - if: steps.scope.outputs.browsers != ''
      shell: bash
      env:
        BROWSER_SET: ${{ steps.scope.outputs.browsers }}
        BROWSER_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        IFS=- read -r -a browsers <<< "$BROWSER_SET"
        apt_cache=~/.cache/playwright-apt
        shopt -s nullglob
        cached=("$apt_cache"/*.deb)
        printf 'Restoring %d cached apt packages\n' "${#cached[@]}"
        if (( ${#cached[@]} > 0 )); then
          sudo cp "${cached[@]}" /var/cache/apt/archives/
        fi
        if [[ "$BROWSER_CACHE_HIT" == true ]]; then
          pnpm exec playwright install-deps "${browsers[@]}"
        else
          pnpm exec playwright install --with-deps "${browsers[@]}"
        fi
        # Drop package versions the mirror no longer offers, then keep the rest for next time.
        sudo apt-get autoclean -qq
        rm -rf "$apt_cache"
        mkdir -p "$apt_cache"
        downloaded=(/var/cache/apt/archives/*.deb)
        printf 'Caching %d apt packages\n' "${#downloaded[@]}"
        if (( ${#downloaded[@]} > 0 )); then
          cp "${downloaded[@]}" "$apt_cache"/
        fi
    # The block-and-Schema diagnostics used to run here as a step of its own on every run that was
    # not a pull request, while a pull request ran it inside the browser checks. Same script, same
    # input; the difference was that the step waited for its turn and the pull request did not.
    # It is a browser check, so it now runs with the others on every path: 43.8s of its own on the
    # deploy of fcf827b became about 18s of the group's wall clock in the CI run of the same tree.
    #
    # It stays before the deploy rather than being left to the published check that repeats it
    # (deploy.yml, against the live URL). The two ask different questions — these bytes, and the
    # bytes that are now live — and only this one can stop the publication, which AGENTS.md asks
    # for: 「取得・照合・検証に失敗した場合は公開を停止し、直前の検証済み公開物を保持します」.
    - shell: bash
      env:
        KAMISHIBAI_WEB_CHECKS: ${{ steps.scope.outputs.web-checks }}
      run: pnpm run check
    - name: Upload block editor regression evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: block-editor-regression
        path: |
          .tmp/block-editor-browser/
          .tmp/published-block-diagnostics/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
