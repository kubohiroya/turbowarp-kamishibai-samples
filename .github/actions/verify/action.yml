name: Verify the samples site
description: >-
  Installs both workspaces and verifies the samples. Pull requests use the committed App
  pin. Pages and scheduled runs refresh the published App and run the full verification.

inputs:
  pull-request:
    description: >-
      The pull request being verified. Its changed files select the browser checks.
      Leave empty for the full published-release verification.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Resolve and verify the published app dependency
      if: inputs.pull-request == ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/app-release.ts
    # Playback, authoring and the downloaded base share this release commit.
    - id: pin
      shell: bash
      run: |
        commit=$(node -e "process.stdout.write(require('./app-release.json').commit)")
        printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
        printf 'Pinned builder commit: %s\n' "$commit"
        printf 'TURBOWARP_KAMISHIBAI_BLOCK_AUTHORING_ROOT=%s/.tmp/turbowarp-kamishibai-app\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        repository: kubohiroya/turbowarp-kamishibai-app
        ref: ${{ steps.pin.outputs.commit }}
        path: .tmp/turbowarp-kamishibai-app
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          .tmp/turbowarp-kamishibai-app/pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
    # The SB3 files are GitHub Release assets recorded in sb3-assets.json, not committed.
    # Fetch them before the regeneration below, which reads some of them.
    - shell: bash
      run: pnpm sb3:fetch
    - shell: bash
      working-directory: .tmp/turbowarp-kamishibai-app
      run: pnpm install --frozen-lockfile
    # Since 4.0.0-rc.12 the pinned CLI runs the compiled dist/, which
    # TurboWarp-Kamishibai does not commit.
    - shell: bash
      working-directory: .tmp/turbowarp-kamishibai-app
      run: pnpm run build:lib
    - name: Regenerate all DSL 4.0 distribution artifacts
      if: inputs.pull-request == ''
      shell: bash
      run: pnpm update:dsl4-artifacts
    - id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        scope=all
        if [[ -n "$PULL_REQUEST" ]]; then
          scope=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | node scripts/web-checks-scope.ts)
        fi
        case "$scope" in
          all) browsers=chromium-webkit ;;
          dsl4|editor) browsers=chromium ;;
          none) browsers= ;;
          *) printf 'Unknown browser check scope: %s\n' "$scope" >&2; exit 1 ;;
        esac
        printf 'web-checks=%s\nbrowsers=%s\n' "$scope" "$browsers" >> "$GITHUB_OUTPUT"
        printf 'Browser checks: %s\n' "$scope"
    - id: playwright-version
      if: steps.scope.outputs.browsers != ''
      shell: bash
      run: |
        version=$(node -e "process.stdout.write(require('playwright/package.json').version)")
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
        printf 'image=%s\n' "$ImageOS" >> "$GITHUB_OUTPUT"
        printf 'image-version=%s\n' "$ImageVersion" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: steps.scope.outputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.playwright-version.outputs.image }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ steps.scope.outputs.browsers }}
    # Cached browser binaries still need the system libraries on a fresh runner. WebKit pulls
    # about 114 MB of .deb packages from the Ubuntu mirror: usually seconds, but over 11 min on a
    # day the mirror ran at 166 kB/s. Keep the downloaded packages in the Actions cache so apt
    # only fetches what changed. A runner image update still restores the previous set.
    - id: playwright-apt-cache
      if: steps.scope.outputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/playwright-apt
        key: playwright-apt-${{ steps.playwright-version.outputs.image }}-${{ steps.playwright-version.outputs.image-version }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ steps.scope.outputs.browsers }}
        restore-keys: |
          playwright-apt-${{ steps.playwright-version.outputs.image }}-
    - if: steps.scope.outputs.browsers != ''
      shell: bash
      env:
        BROWSER_SET: ${{ steps.scope.outputs.browsers }}
        BROWSER_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        IFS=- read -r -a browsers <<< "$BROWSER_SET"
        apt_cache=~/.cache/playwright-apt
        shopt -s nullglob
        cached=("$apt_cache"/*.deb)
        printf 'Restoring %d cached apt packages\n' "${#cached[@]}"
        if (( ${#cached[@]} > 0 )); then
          sudo cp "${cached[@]}" /var/cache/apt/archives/
        fi
        if [[ "$BROWSER_CACHE_HIT" == true ]]; then
          pnpm exec playwright install-deps "${browsers[@]}"
        else
          pnpm exec playwright install --with-deps "${browsers[@]}"
        fi
        # Drop package versions the mirror no longer offers, then keep the rest for next time.
        sudo apt-get autoclean -qq
        rm -rf "$apt_cache"
        mkdir -p "$apt_cache"
        downloaded=(/var/cache/apt/archives/*.deb)
        printf 'Caching %d apt packages\n' "${#downloaded[@]}"
        if (( ${#downloaded[@]} > 0 )); then
          cp "${downloaded[@]}" "$apt_cache"/
        fi
    # Diagnose the runs GitHub reports as cancelled without a timeout, a superseding run or any
    # failure of our own: the runner's memory fills within a minute of the check starting and the
    # kernel takes the process, and a cancelled job keeps its logs only for what it already
    # printed. So report the runner's resources before the check and keep sampling them while it
    # runs, with each line timestamped. Remove this once those cancellations are explained.
    - name: Report the runner's resources
      shell: bash
      run: |
        printf 'cpus=%s\n' "$(nproc)"
        free -m
        df -h
        ulimit -a
        node --input-type=module -e "
          const {default: config} = await import('./vite.config.ts');
          console.log('vitest test options:', JSON.stringify(config.test));
        "
    - shell: bash
      env:
        KAMISHIBAI_WEB_CHECKS: ${{ steps.scope.outputs.web-checks }}
        KAMISHIBAI_BLOCK_DIAGNOSTICS: ${{ inputs.pull-request != '' && '1' || '0' }}
        # Keep glibc from holding freed memory in per-thread arenas. Building an SB3 is mostly
        # Buffer and zlib work, which lives outside V8's heap, so no heap limit bounds it and no
        # collection returns it; glibc gives each thread an arena of its own, up to eight per core,
        # and what a thread frees stays in its arena. The same suite costs 3.3 GB on a developer
        # machine, whose allocator returns memory to the system promptly, and exhausts the runner.
        MALLOC_ARENA_MAX: '2'
      run: |
        # The totals alone do not say who holds the memory, so each line also names the largest
        # processes. That tells apart the type check, the test workers and however many of them
        # actually ran. `Shmem` is counted as used but written as files, so a run that fills a
        # RAM-backed filesystem looks like a leak in the totals alone.
        sample() {
          while :; do
            printf '[resources] %s %s %s %s | %s\n' \
              "$(date -u +%H:%M:%S)" \
              "$(free -m | awk '/^Mem:/ {memory = sprintf("mem_used=%sM mem_available=%sM", $3, $7)} /^Swap:/ {swap = sprintf("swap_used=%sM", $3)} END {print memory, swap}')" \
              "$(awk '/^Shmem:/ {printf "shmem=%dM", $2 / 1024}' /proc/meminfo)" \
              "$(df -m / | awk 'NR == 2 {printf "disk_used=%sM disk_available=%sM (%s)", $3, $4, $5}')" \
              "$(ps -eo rss=,args= --sort=-rss | head -5 | awk '{rss = $1 / 1024; $1 = ""; printf "%dM %s; ", rss, substr($0, 2, 60)}')"
            sleep 5
          done
        }
        sample &
        sampler=$!
        trap 'kill "$sampler" 2> /dev/null || true' EXIT
        pnpm run check
    - name: Verify block and Schema diagnostics in TurboWarp-Plus-Editor
      if: inputs.pull-request == ''
      shell: bash
      run: node scripts/verify-published-block-diagnostics.ts --input dist/stories/urashima/urashima-blocks-4.0.sb3
    - name: Upload block editor regression evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: block-editor-regression
        path: |
          .tmp/block-editor-browser/
          .tmp/published-block-diagnostics/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
