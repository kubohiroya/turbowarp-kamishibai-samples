name: Verify the samples site
description: >-
  Installs both workspaces and verifies the samples. Pull requests use the committed App
  pin. Pages and scheduled runs refresh the published App and run the full verification.

inputs:
  pull-request:
    description: >-
      The pull request being verified. Its changed files select the browser checks.
      Leave empty for the full published-release verification.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Resolve and verify the published app dependency
      if: inputs.pull-request == ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/app-release.ts
    # Playback, authoring and the downloaded base share this release commit.
    - id: pin
      shell: bash
      run: |
        commit=$(node -e "process.stdout.write(require('./app-release.json').commit)")
        printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
        printf 'Pinned builder commit: %s\n' "$commit"
        printf 'TURBOWARP_KAMISHIBAI_BLOCK_AUTHORING_ROOT=%s/.tmp/turbowarp-kamishibai-app\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
      with:
        repository: kubohiroya/turbowarp-kamishibai-app
        ref: ${{ steps.pin.outputs.commit }}
        path: .tmp/turbowarp-kamishibai-app
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          .tmp/turbowarp-kamishibai-app/pnpm-lock.yaml
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      working-directory: .tmp/turbowarp-kamishibai-app
      run: pnpm install --frozen-lockfile
    # Since 4.0.0-rc.12 the pinned CLI runs the compiled dist/, which
    # TurboWarp-Kamishibai does not commit.
    - shell: bash
      working-directory: .tmp/turbowarp-kamishibai-app
      run: pnpm run build:lib
    - name: Regenerate all DSL 4.0 distribution artifacts
      if: inputs.pull-request == ''
      shell: bash
      run: pnpm update:dsl4-artifacts
    - id: scope
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        scope=all
        if [[ -n "$PULL_REQUEST" ]]; then
          scope=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_REQUEST}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | node scripts/web-checks-scope.ts)
        fi
        case "$scope" in
          all) browsers=chromium-webkit ;;
          dsl4|editor) browsers=chromium ;;
          none) browsers= ;;
          *) printf 'Unknown browser check scope: %s\n' "$scope" >&2; exit 1 ;;
        esac
        printf 'web-checks=%s\nbrowsers=%s\n' "$scope" "$browsers" >> "$GITHUB_OUTPUT"
        printf 'Browser checks: %s\n' "$scope"
    - id: playwright-version
      if: steps.scope.outputs.browsers != ''
      shell: bash
      run: |
        version=$(node -e "process.stdout.write(require('playwright/package.json').version)")
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
        printf 'image=%s\n' "$ImageOS" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: steps.scope.outputs.browsers != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ steps.playwright-version.outputs.image }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ steps.scope.outputs.browsers }}
    # Cached browser binaries still need the system libraries on a fresh runner.
    - if: steps.scope.outputs.browsers != ''
      shell: bash
      env:
        BROWSER_SET: ${{ steps.scope.outputs.browsers }}
        BROWSER_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      run: |
        IFS=- read -r -a browsers <<< "$BROWSER_SET"
        if [[ "$BROWSER_CACHE_HIT" == true ]]; then
          pnpm exec playwright install-deps "${browsers[@]}"
        else
          pnpm exec playwright install --with-deps "${browsers[@]}"
        fi
    - shell: bash
      env:
        KAMISHIBAI_WEB_CHECKS: ${{ steps.scope.outputs.web-checks }}
        KAMISHIBAI_BLOCK_DIAGNOSTICS: ${{ inputs.pull-request != '' && '1' || '0' }}
      run: pnpm run check
    - name: Verify block and Schema diagnostics in TurboWarp-Plus-Editor
      if: inputs.pull-request == ''
      shell: bash
      run: node scripts/verify-published-block-diagnostics.ts --input dist/stories/urashima/urashima-blocks-4.0.sb3
    - name: Upload block editor regression evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: block-editor-regression
        path: |
          .tmp/block-editor-browser/
          .tmp/published-block-diagnostics/
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
        compression-level: 0
