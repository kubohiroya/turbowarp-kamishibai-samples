name: CI

on:
  pull_request:

permissions:
  contents: read

# A pull request only needs its newest push verified.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    # Playwright WebKit 1.61 uses the Ubuntu 24.04 system libraries.
    runs-on: ubuntu-24.04
    # Keep a ceiling for builds and browser checks that depend on external services.
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      TURBOWARP_KAMISHIBAI_APP_ROOT: ${{ github.workspace }}/.tmp/turbowarp-kamishibai-app
    steps:
      - uses: actions/checkout@v7
      # Use the committed App pin and select browser checks from the changed files.
      - uses: ./.github/actions/verify
        with:
          pull-request: ${{ github.event.pull_request.number }}
