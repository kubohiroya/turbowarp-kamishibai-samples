name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [app-release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    env:
      TZ: Asia/Tokyo
      TURBOWARP_KAMISHIBAI_APP_ROOT: ${{ github.workspace }}/.tmp/turbowarp-kamishibai-app
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Playwright WebKit 1.61 uses the Ubuntu 24.04 system libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Builds dist/ as a side effect of pnpm run check, which the upload step publishes.
      - uses: ./.github/actions/verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # The artifact listing that deploy-pages reads lags behind the upload, so the deploy waits for
      # it before the first attempt.
      #
      # deploy-pages looks its artifact up by name and fails when the listing does not hold it
      # (src/internal/api-client.js). That listing did not hold `github-pages` 0.7s after
      # upload-pages-artifact reported it finalized, which stopped the publication of #325 and #326
      # on 2026-11-25:
      #
      #   12:31:55.058  Artifact github-pages successfully finalized. Artifact ID 15021777988
      #   12:31:55.749  Deploy:       Found 1 artifact(s)   <- the count is before the name filter
      #   12:31:56.642  Retry deploy: Found 1 artifact(s)
      #
      # The artifact was not missing: the REST API lists it at 233,503,045 bytes with the digest the
      # upload reported, and the deploy that succeeded 1h34m earlier found 2. So this is the listing
      # catching up, and a retry one second later reads the same stale listing and fails the same
      # way — which is what both failed runs did.
      #
      # #327 put a minute between the two attempts and the deploys of c7f3dba and 5ee1024 then
      # published. But in all three runs since the lag appeared the first attempt saw one artifact
      # and failed, so the wait belongs before it rather than after: a wasted attempt, and an
      # `##[error]` in the log of a deploy that went on to succeed, are worse than a minute spent in
      # the open. That error has already been read as a broken deploy once.
      #
      # A minute is margin rather than a measured requirement. The observed gap was under a second,
      # and how long the listing can lag is not something these logs settle; a first attempt that
      # fails here again is the sign that this number is too small.
      - name: Wait for the uploaded artifact to appear in the listing
        run: sleep 60
      # deploy-pages caps its own timeout at 10 min, and GitHub Pages file sync (syncing_files) has
      # been exceeding that. Retry once with the same artifact. That failure mode has already spent
      # ten minutes by the time it fails, so the retry needs no wait of its own.
      - name: Deploy to GitHub Pages
        id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Resolve published Pages URL
        id: deployment
        env:
          PAGE_URL: ${{ steps.deployment_first.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
      - name: Verify published block script in TurboWarp
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-block-editor.ts --base-url "$PAGES_URL"
      - name: Verify published block and Schema diagnostics
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-block-diagnostics.ts --base-url "$PAGES_URL"
      - name: Upload published block editor regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-block-editor-regression
          path: |
            .tmp/published-block-editor/
            .tmp/published-block-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
