name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [app-release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    env:
      TZ: Asia/Tokyo
      TURBOWARP_KAMISHIBAI_APP_ROOT: ${{ github.workspace }}/.tmp/turbowarp-kamishibai-app
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Playwright WebKit 1.61 uses the Ubuntu 24.04 system libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Builds dist/ as a side effect of pnpm run check, which the upload step publishes.
      - uses: ./.github/actions/verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # deploy-pages caps its timeout at 10 min, and GitHub Pages file sync
      # (syncing_files) has been exceeding that. Retry once with the same artifact.
      - name: Deploy to GitHub Pages
        id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Resolve published Pages URL
        id: deployment
        env:
          PAGE_URL: ${{ steps.deployment_first.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
      - name: Verify published block script in TurboWarp
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-block-editor.ts --base-url "$PAGES_URL"
      - name: Verify published block and Schema diagnostics
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-block-diagnostics.ts --base-url "$PAGES_URL"
      - name: Upload published block editor regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-block-editor-regression
          path: |
            .tmp/published-block-editor/
            .tmp/published-block-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
