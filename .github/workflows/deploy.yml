name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [app-release-published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    env:
      TZ: Asia/Tokyo
      TURBOWARP_KAMISHIBAI_APP_ROOT: ${{ github.workspace }}/.tmp/turbowarp-kamishibai-app
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Playwright WebKit 1.61 uses the Ubuntu 24.04 system libraries.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Builds dist/ as a side effect of pnpm run check, which the upload step publishes.
      - uses: ./.github/actions/verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # deploy-pages caps its timeout at 10 min, and GitHub Pages file sync
      # (syncing_files) has been exceeding that. Retry once with the same artifact.
      - name: Deploy to GitHub Pages
        id: deployment_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # Two failure modes reach the retry, and only one of them has already waited.
      #
      # The sync timeout above has spent ten minutes by the time it fails. The second mode fails in
      # under a second, and it stopped the publication of #325 and #326 on 2026-11-25: deploy-pages
      # looks its artifact up by name and fails when the listing does not hold it
      # (src/internal/api-client.js), and the listing did not hold `github-pages` 0.7s after
      # upload-pages-artifact reported it finalized.
      #
      #   12:31:55.058  Artifact github-pages successfully finalized. Artifact ID 15021777988
      #   12:31:55.749  Deploy:       Found 1 artifact(s)   <- the count is before the name filter
      #   12:31:56.642  Retry deploy: Found 1 artifact(s)
      #
      # The artifact was never missing: the REST API lists it at 233,503,045 bytes with the digest
      # the upload reported, and the deploy that succeeded 1h34m earlier found 2. So this is the
      # listing catching up, and a retry one second later reads the same stale listing and fails
      # the same way — which is what both failed runs did.
      #
      # A minute is margin rather than a measured requirement: the observed gap was under a second
      # in both runs, and how long the listing can lag is not something these logs settle. It costs
      # a minute on a run that takes about ten, and only on a run that has already failed once.
      - name: Wait before retrying the deploy
        if: steps.deployment_first.outcome == 'failure'
        run: sleep 60
      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Resolve published Pages URL
        id: deployment
        env:
          PAGE_URL: ${{ steps.deployment_first.outputs.page_url || steps.deployment_retry.outputs.page_url }}
        run: echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
      - name: Verify published block script in TurboWarp
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-block-editor.ts --base-url "$PAGES_URL"
      - name: Verify published block and Schema diagnostics
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-published-block-diagnostics.ts --base-url "$PAGES_URL"
      - name: Upload published block editor regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-block-editor-regression
          path: |
            .tmp/published-block-editor/
            .tmp/published-block-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
