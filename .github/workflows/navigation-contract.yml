name: Navigation contract

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-site.ts"
      - "scripts/verify-site.ts"
      - ".github/workflows/navigation-contract.yml"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-site.ts"
      - "scripts/verify-site.ts"
      - ".github/workflows/navigation-contract.yml"

permissions:
  contents: read

jobs:
  verify-package-consumption:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check samples repository
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The navigation renderer, contract and site shell come from the shared package only;
      # a local copy would drift from the other TurboWarp-Kamishibai sites again.
      - name: Verify shared navigation package consumption
        run: |
          test ! -e scripts/site-navigation.ts
          test ! -e scripts/site-navigation.mjs
          test ! -e site/contracts/navigation-contract.json
          test ! -e site/site-shell.css
          node --input-type=module -e "import('@kubohiroya/turbowarp-kamishibai-site-navigation').then((mod) => { if (mod.NAVIGATION_CONTRACT.contractVersion !== '2.0.0') throw new Error('Unexpected navigation contract version'); })"
